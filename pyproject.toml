[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oscal-digital-twin-lab"
version = "0.1.0"
description = "OSCAL-powered digital twin playground with LangGraph agents for continuous compliance assurance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "OSCAL Digital Twin Lab" }
]
keywords = ["oscal", "digital-twin", "langgraph", "compliance", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph==1.2.19",
    "langchain==1.4.8",
    "langchain-openai==1.7.3",
    "langchain-community==0.4.2",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "streamlit==1.66.1",
    "plotly==7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[project.scripts]
oscal-dtl = "oscal_dtl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oscal_dtl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
